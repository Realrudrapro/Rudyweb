name = "rudyweb"
main = "src/index.js"
compatibility_date = "2024-01-01"

[env.production]
vars = { ENVIRONMENT = "production" }

[build]
cwd = "."
command = "npm run build"
watch_paths = ["public/**/*"]

[build.upload]
format = "service-worker"

[site]
bucket = "./public"

[[routes]]
pattern = "https://rudyweb.pages.dev/*"
zone_name = "pages.dev"
